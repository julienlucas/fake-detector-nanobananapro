<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FakeFinder IA vs Real</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔍 FakeFinder</h1>
      <p class="subtitle">Détecteur d'Images IA</p>
    </div>

    <div class="upload-section">
      <label for="imageInput" class="upload-label">
        <div class="upload-area" id="uploadArea">
          <span class="upload-icon">📷</span>
          <span class="upload-text">Cliquez pour sélectionner une image</span>
          <span class="upload-hint">ou glissez-déposez ici</span>
        </div>
        <input type="file" id="imageInput" accept="image/*" style="display: none;" />
      </label>
    </div>

    <div id="previewSection" class="preview-section" style="display: none;">
      <img id="previewImage" class="preview-image" />
      <div id="resultInfo" class="result-info"></div>
    </div>

    <div id="loading" class="loading" style="display: none;">
      <div class="spinner"></div>
      <p>Analyse en cours...</p>
    </div>

    <div id="status" class="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>

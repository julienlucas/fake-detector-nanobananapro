[project]
name = "fakefinder-website"
version = "2.0.0"
description = "Détecteur de deepfakes Nano Banana Pro et images générées avec l'IA"
authors = [{name = "Julien Lucas", email = "hello@julienlucas.com"}]
requires-python = ">=3.11,<3.13"
dependencies = [
    # Dépendances minimales pour l'inférence ONNX (Vercel serverless)
    "python-dotenv>=1.1.1",
    "numpy<2.0.0",
    "onnxruntime>=1.16.0",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
web = [
    "django>=5.2.6",
    "django-cors-headers>=4.3.0",
]
tracking = [
    "langsmith>=0.1.0",
]
